services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: satellite
      POSTGRES_USER: satellite
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U satellite -d satellite"]
      interval: 5s
      retries: 12
    volumes: ["postgres-data:/var/lib/postgresql/data"]
  api:
    build: ./backend
    restart: on-failure
    environment:
      DATABASE_URL: postgresql://satellite:${DB_PASSWORD}@postgres:5432/satellite
      MFA_KEY_PATH: /data/security/mfa.key
      COOKIE_SECURE: "true"
    volumes: ["security-data:/data/security"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      retries: 12
    depends_on:
      postgres: {condition: service_healthy}
  frontend:
    build: ./frontend
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api: {condition: service_healthy}
  gateway:
    image: caddy:2-alpine
    environment:
      SITE_HOST: ${SITE_HOST:-localhost}
    ports: ["443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [frontend]
volumes:
  postgres-data:
  security-data:
  caddy-data:
